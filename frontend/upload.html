<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This sets the text format for the page. -->
    <meta charset="UTF-8">

    <!-- This makes the page responsive. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Invoice</title>

    <!-- This adds the browser tab icon. -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <!-- This loads the main CSS file. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="detail-body">
    <main class="invoice-detail-page">

            <!-- This section shows Flask messages. -->
        <!-- Flask messages tell the user what happened. -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="message-overlay" id="message-overlay">
                    {% for category, message in messages %}
                        <div class="message-box {{ category }}">
                            <p>{{ message }}</p>

                            <!-- This button closes the message. -->
                            <button type="button" onclick="closeMessage()">OK</button>
                        </div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        <!-- This button returns to the dashboard. -->
        <a class="back-button" href="/">Back to dashboard</a>

        <section class="invoice-detail-card">
            <div class="detail-header">
                <div>
                    <p class="detail-eyebrow">Invoice Upload</p>
                    <h1>Upload Invoice</h1>
                    <p class="detail-subtitle">Add a new invoice document to the system.</p>
                </div>
            </div>

            <!-- This form sends the invoice file to Flask. -->
            <form class="upload-form" method="POST" enctype="multipart/form-data">
                <label class="upload-label" for="invoice-file">
                    Select invoice file
                </label>

                <!-- This input accepts TXT now and prepares PDF/images for OCR later. -->
                <input
                    id="invoice-file"
                    name="invoice_file"
                    type="file"
                    accept=".txt,.pdf,.png,.jpg,.jpeg"
                >

                <!-- This button will process the invoice in the next step. -->
                <button class="upload-button" type="submit">
                    Process Invoice
                </button>
            </form>
        </section>
    </main>

    <!-- This loads the JavaScript file using Flask static path. -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
